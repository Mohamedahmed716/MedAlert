<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign Up for MedAlert</title>

    <!-- Google Fonts and Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="SignUp.css" />
  </head>
  <body>
    <div class="container">
      <div class="layout-container">
        <div class="main-content">
          <div class="content-wrapper">
            <div class="signup-container">
              <!-- Logo and App Name -->
              <div class="logo-header">
                <img src="../../../../assets/Logo.png" alt="MedAlert Logo" />
              </div>

              <!-- Page Title and Subtitle -->
              <div class="header-text">
                <div class="header-text-content">
                  <p class="title">Create an Account</p>
                  <p class="subtitle">Join MedAlert today. It's quick and easy.</p>
                </div>
              </div>

              <!-- Sign Up Form -->
              <form class="signup-form">
                <!-- Full Name Field -->
                <div class="form-group">
                  <label class="form-label">
                    <p class="input-label">Full Name</p>
                    <input class="form-input" placeholder="Enter your full name" type="text" />
                  </label>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                  <label class="form-label">
                    <p class="input-label">Email</p>
                    <input class="form-input" placeholder="Enter your email" type="email" />
                  </label>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                  <label class="form-label">
                    <p class="input-label">Password</p>
                    <div class="password-wrapper">
                      <input
                        class="form-input password-input"
                        placeholder="Create a password"
                        type="password"
                        id="passwordField"
                      />
                      <button type="button" class="toggle-visibility" id="togglePassword">
                        <span class="material-symbols-outlined">visibility_off</span>
                      </button>
                    </div>
                  </label>
                </div>

                <!-- Date of Birth Field -->
                <div class="form-group">
                  <label class="form-label">
                    <p class="input-label">Date of Birth</p>
                    <input class="form-input" placeholder="MM/DD/YYYY" type="date" />
                  </label>
                </div>

                <!-- Role Selection -->
                <div class="form-group">
                  <label class="form-label">
                    <p class="input-label">Role</p>
                    <div class="select-wrapper">
                      <select class="form-input" id="roleSelect">
                        <option value="" disabled selected>Select your role</option>
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="admin">Hospital Admin</option>
                      </select>
                      <span class="material-symbols-outlined select-icon">expand_more</span>
                    </div>
                  </label>
                </div>

                <!-- Conditional Hospital Selection (Hidden by default) -->
                <div class="form-group hidden" id="hospitalGroup">
                  <label class="form-label">
                    <p class="input-label">Hospital Assignment</p>
                    <div class="select-wrapper">
                      <select class="form-input">
                        <option value="" disabled selected>Select a hospital</option>
                        <option value="general">General Hospital</option>
                        <option value="city">City Central Medical Center</option>
                        <option value="sunrise">Sunrise Health Clinic</option>
                      </select>
                      <span class="material-symbols-outlined select-icon">domain</span>
                    </div>
                  </label>
                </div>

                <!-- Create Account Button -->
                <div class="form-group form-group-button">
                  <button type="submit" class="btn btn-primary">
                    <span class="truncate">Create Account</span>
                  </button>
                </div>

                <!-- Sign In Link -->
                <p class="signin-link">
                  Already have an account?
                  <a class="link" href="#">Sign In</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Password Visibility Toggle
      document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordField = document.getElementById('passwordField');
        const icon = this.querySelector('span');

        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          icon.textContent = 'visibility';
        } else {
          passwordField.type = 'password';
          icon.textContent = 'visibility_off';
        }
      });

      // Role Conditional Logic
      const roleSelect = document.getElementById('roleSelect');
      const hospitalGroup = document.getElementById('hospitalGroup');

      roleSelect.addEventListener('change', function () {
        const value = this.value;
        // Show hospital field if role is Doctor or Admin
        if (value === 'doctor' || value === 'admin') {
          hospitalGroup.classList.remove('hidden');
        } else {
          hospitalGroup.classList.add('hidden');
        }
      });
    </script>
  </body>
</html>
