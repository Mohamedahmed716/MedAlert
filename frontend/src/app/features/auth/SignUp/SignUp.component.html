<div class="container">
  <div class="layout-container">
    <div class="main-content">
      <div class="content-wrapper">
        <div class="signup-container">
          <div class="logo-header">
            <img src="assets/Logo.png" alt="MedAlert Logo" />
          </div>

          <div class="header-text">
            <div class="header-text-content">
              <p class="title">Create an Account</p>
              <p class="subtitle">Join MedAlert today. It's quick and easy.</p>
            </div>
          </div>

          <form class="signup-form" (ngSubmit)="onSignUp()" #signupForm="ngForm">
            <div *ngIf="errorMessage" class="error-message">
              {{ errorMessage }}
            </div>

            <div class="form-group">
              <label class="form-label">
                <p class="input-label">Full Name</p>
                <input
                  class="form-input"
                  placeholder="Enter your full name"
                  type="text"
                  name="fullName"
                  [(ngModel)]="user.fullName"
                  required
                />
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <p class="input-label">Email</p>
                <input
                  class="form-input"
                  placeholder="Enter your email"
                  type="email"
                  name="email"
                  [(ngModel)]="user.email"
                  required
                />
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <p class="input-label">Password</p>
                <div class="password-wrapper">
                  <input
                    class="form-input password-input"
                    placeholder="Create a password"
                    [type]="passwordVisible1 ? 'text' : 'password'"
                    name="password"
                    [(ngModel)]="user.password"
                    required
                  />
                  <button type="button" class="toggle-visibility" (click)="togglePassword1()">
                    <span class="material-symbols-outlined">
                      {{ passwordVisible1 ? 'visibility' : 'visibility_off' }}
                    </span>
                  </button>
                </div>
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <p class="input-label">Confirm Password</p>
                <div class="password-wrapper">
                  <input
                    class="form-input password-input"
                    placeholder="Confirm password"
                    [type]="passwordVisible2 ? 'text' : 'password'"
                    name="confirmPassword"
                    [(ngModel)]="user.confirmPassword"
                    required
                  />
                  <button type="button" class="toggle-visibility" (click)="togglePassword2()">
                    <span class="material-symbols-outlined">
                      {{ passwordVisible2 ? 'visibility' : 'visibility_off' }}
                    </span>
                  </button>
                </div>
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <p class="input-label">Date of Birth</p>
                <input
                  class="form-input"
                  placeholder="MM/DD/YYYY"
                  type="date"
                  name="dateOfBirth"
                  [(ngModel)]="user.dateOfBirth"
                  required
                />
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <p class="input-label">Role</p>
                <div class="select-wrapper">
                  <select class="form-input" name="role" [(ngModel)]="user.role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="Patient">Patient</option>
                    <option value="Doctor">Doctor</option>
                    <option value="Hospital Admin">Hospital Admin</option>
                  </select>
                  <span class="material-symbols-outlined select-icon">expand_more</span>
                </div>
              </label>
            </div>

            <div class="form-group" *ngIf="showHospitalField">
              <label class="form-label">
                <p class="input-label">Hospital Assignment</p>
                <div class="select-wrapper">
                  <select class="form-input" name="hospital" [(ngModel)]="user.hospital" required>
                    <option value="" disabled selected>Select a hospital</option>

                    <option disabled *ngIf="hospitals.length === 0">No hospitals found...</option>

                    <option *ngFor="let h of hospitals" [value]="h.id">
                      {{ h.name || h.hospitalName || h.title || h.id }}
                    </option>
                  </select>
                  <span class="material-symbols-outlined select-icon">domain</span>
                </div>
              </label>
            </div>

            <div class="form-group form-group-button">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="
                  signupForm.invalid || isLoading || user.password !== user.confirmPassword
                "
              >
                <span class="truncate">{{ isLoading ? 'Creating...' : 'Create Account' }}</span>
              </button>
            </div>

            <p class="signin-link">
              Already have an account?
              <a class="link" routerLink="/auth/SignIn">Sign In</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
