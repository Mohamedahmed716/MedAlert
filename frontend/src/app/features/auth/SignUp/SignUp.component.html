<div class="container">
  <div class="layout-container">
    <div class="main-content">
      <div class="content-wrapper">
        <div class="signup-container">
          <div class="logo-header">
            <img src="assets/Logo.png" alt="MedAlert Logo" />
          </div>

          <div class="header-text">
            <p class="title">Create an Account</p>
            <p class="subtitle">Join MedAlert today. It's quick and easy.</p>
          </div>

          <form class="signup-form" (ngSubmit)="onSignUp()" #signupForm="ngForm">
            <div *ngIf="errorMessage" class="error-message">
              {{ errorMessage }}
            </div>

            <div class="form-group">
              <label class="form-label">
                <span class="input-label">Full Name</span>
                <input
                  class="form-input"
                  placeholder="Enter your full name"
                  type="text"
                  name="fullName"
                  [(ngModel)]="user.fullName"
                  required
                />
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <span class="input-label">Email</span>
                <input
                  class="form-input"
                  placeholder="Enter your email"
                  type="email"
                  name="email"
                  [(ngModel)]="user.email"
                  required
                />
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <span class="input-label">Password</span>
                <div class="password-wrapper">
                  <input
                    class="form-input password-input"
                    placeholder="Create a password"
                    [type]="passwordVisible1 ? 'text' : 'password'"
                    name="password"
                    [(ngModel)]="user.password"
                    required
                  />
                  <button type="button" class="toggle-visibility" (click)="togglePassword1()">
                    <span class="material-symbols-outlined">{{
                      passwordVisible1 ? 'visibility' : 'visibility_off'
                    }}</span>
                  </button>
                </div>
              </label>
            </div>

            <div class="form-group">
              <label class="form-label">
                <span class="input-label">Confirm Password</span>
                <div class="password-wrapper">
                  <input
                    class="form-input password-input"
                    placeholder="Confirm password"
                    [type]="passwordVisible2 ? 'text' : 'password'"
                    name="confirmPassword"
                    [(ngModel)]="user.confirmPassword"
                    required
                  />
                  <button type="button" class="toggle-visibility" (click)="togglePassword2()">
                    <span class="material-symbols-outlined">{{
                      passwordVisible2 ? 'visibility' : 'visibility_off'
                    }}</span>
                  </button>
                </div>
              </label>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem">
              <div class="form-group">
                <label class="form-label">
                  <span class="input-label">Date of Birth</span>
                  <div class="custom-select-container" (click)="$event.stopPropagation()">
                    <div
                      class="form-input select-trigger"
                      [class.active]="isDateOpen"
                      (click)="toggleDate()"
                    >
                      <span [class.placeholder-text]="!user.dateOfBirth">
                        {{ user.dateOfBirth || 'mm/dd/yyyy' }}
                      </span>
                      <span
                        class="material-symbols-outlined select-arrow"
                        [class.rotate]="isDateOpen"
                        >calendar_month</span
                      >
                    </div>

                    <div class="calendar-popup" *ngIf="isDateOpen">
                      <div class="calendar-header">
                        <div class="month-nav">
                          <button type="button" class="nav-btn" (click)="prevMonth()">
                            <span class="material-symbols-outlined">chevron_left</span>
                          </button>
                          <span class="current-month-display">{{ monthNames[currentMonth] }}</span>
                          <button type="button" class="nav-btn" (click)="nextMonth()">
                            <span class="material-symbols-outlined">chevron_right</span>
                          </button>
                        </div>
                        <select
                          class="year-select"
                          [ngModel]="currentYear"
                          (ngModelChange)="jumpToYear($event)"
                          [ngModelOptions]="{ standalone: true }"
                        >
                          <option *ngFor="let y of yearRange" [value]="y">{{ y }}</option>
                        </select>
                      </div>
                      <div class="calendar-grid-header">
                        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span
                        ><span>Fr</span><span>Sa</span>
                      </div>
                      <div class="calendar-grid">
                        <div
                          *ngFor="let day of calendarDays"
                          class="calendar-day"
                          [class.empty]="!day"
                          [class.future]="isFutureDate(day)"
                          (click)="!isFutureDate(day) && selectDate(day)"
                        >
                          {{ day }}
                        </div>
                      </div>
                    </div>
                  </div>
                </label>
              </div>

              <div class="form-group">
                <label class="form-label">
                  <span class="input-label">Gender</span>
                  <div class="custom-select-container" (click)="$event.stopPropagation()">
                    <div
                      class="form-input select-trigger"
                      [class.active]="isGenderOpen"
                      (click)="toggleGender()"
                    >
                      <span>{{ user.gender }}</span>
                      <span
                        class="material-symbols-outlined select-arrow"
                        [class.rotate]="isGenderOpen"
                        >expand_more</span
                      >
                    </div>
                    <div class="custom-options" *ngIf="isGenderOpen">
                      <div class="option-item" *ngFor="let g of genders" (click)="selectGender(g)">
                        {{ g }}
                      </div>
                    </div>
                  </div>
                </label>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">
                <span class="input-label">Role</span>
                <div class="custom-select-container" (click)="$event.stopPropagation()">
                  <div
                    class="form-input select-trigger"
                    [class.active]="isRoleOpen"
                    (click)="toggleRole()"
                  >
                    <span [class.placeholder-text]="!user.role">{{
                      user.role || 'Select your role'
                    }}</span>
                    <span class="material-symbols-outlined select-arrow" [class.rotate]="isRoleOpen"
                      >expand_more</span
                    >
                  </div>

                  <div class="custom-options" *ngIf="isRoleOpen">
                    <div class="option-item" *ngFor="let role of roles" (click)="selectRole(role)">
                      <span class="material-symbols-outlined option-icon">
                        {{
                          role === 'Doctor'
                            ? 'stethoscope'
                            : role === 'Patient'
                            ? 'person'
                            : 'admin_panel_settings'
                        }}
                      </span>
                      {{ role }}
                    </div>
                  </div>
                </div>
              </label>
            </div>

            <div class="form-group" *ngIf="showHospitalField">
              <label class="form-label">
                <span class="input-label">Hospital Assignment</span>
                <div class="custom-select-container" (click)="$event.stopPropagation()">
                  <div
                    class="form-input select-trigger"
                    [class.active]="isHospitalOpen"
                    (click)="toggleHospital()"
                  >
                    <span [class.placeholder-text]="!selectedHospitalName">{{
                      selectedHospitalName || 'Select a hospital'
                    }}</span>
                    <span
                      class="material-symbols-outlined select-arrow"
                      [class.rotate]="isHospitalOpen"
                      >domain</span
                    >
                  </div>

                  <div class="custom-options" *ngIf="isHospitalOpen">
                    <div class="option-item disabled" *ngIf="hospitals.length === 0">
                      No hospitals found...
                    </div>
                    <div
                      class="option-item"
                      *ngFor="let h of hospitals"
                      (click)="selectHospital(h)"
                    >
                      <span class="material-symbols-outlined option-icon">local_hospital</span>
                      {{ h.name || h.hospitalName || h.title || h.id }}
                    </div>
                  </div>
                </div>
              </label>
            </div>

            <div class="form-group form-group-button">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="
                  signupForm.invalid || isLoading || user.password !== user.confirmPassword
                "
              >
                <span class="truncate">{{ isLoading ? 'Creating...' : 'Create Account' }}</span>
              </button>
            </div>

            <p class="signin-link">
              Already have an account? <a class="link" routerLink="/auth/SignIn">Sign In</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
