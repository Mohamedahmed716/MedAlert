<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign In to MedAlert</title>

    <!-- Google Fonts and Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="SignIn.css" />
  </head>
  <body>

    <div class="container">
      <div class="layout-container">
        <div class="main-content">
          <div class="content-wrapper">
            <div class="login-container">

              <!-- Logo and App Name -->
              <div class="logo-header">
                <img src="../../../shared/ui/Logo.png" alt="">
                <p class="subtitle">
                    Smart health management. All in one place.
                </p>
              </div>

              <!-- Page Title and Subtitle -->
              <div class="header-text">
                <div class="header-text-content">
                  <p class="title">Sign In to MedAlert</p>
                </div>
              </div>

              <!-- Sign In Form -->
              <form class="login-form">

                <!-- Username/Email Field -->
                <div class="form-group">
                  <label class="form-label">
                    <p class="input-label">Username or Email</p>
                    <input
                      class="form-input"
                      placeholder="Enter your username or email"
                      type="text"
                    />
                  </label>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                  <label class="form-label">
                    <p class="input-label">Password</p>
                    <div class="password-wrapper">
                      <input
                        class="form-input password-input"
                        placeholder="Enter your password"
                        type="password"
                        id="passwordField"
                      />
                      <button type="button" class="toggle-visibility" id="togglePassword">
                        <span class="material-symbols-outlined">visibility</span>
                      </button>
                    </div>
                  </label>
                </div>

                <!-- Sign In Button -->
                <div class="form-group">
                  <button type="submit" class="btn btn-primary">
                    <span class="truncate">Sign In</span>
                  </button>
                </div>

                <!-- Divider -->
                <div class="divider">
                  <hr class="divider-line" />
                  <p class="divider-text">OR</p>
                  <hr class="divider-line" />
                </div>

                <!-- Guest Button -->
                <div class="form-group">
                  <button type="button" class="btn btn-secondary">
                    <span class="truncate">Continue as Guest</span>
                  </button>
                </div>

                <!-- Sign Up Link -->
                <p class="signup-link">
                  Don't have an account?
                  <a class="link" href="#">Sign Up</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Simple script for password visibility toggle -->
    <script>
      document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordField = document.getElementById('passwordField');
        const icon = this.querySelector('span');

        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          passwordField.type = 'password';
          icon.textContent = 'visibility';
        }
      });
    </script>
  </body>
</html>
