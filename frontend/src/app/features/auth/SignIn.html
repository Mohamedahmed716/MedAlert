<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign In to MedAlert</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#1193d4',
              'background-light': '#f6f7f8',
              'background-dark': '#101c22',
            },
            fontFamily: {
              display: ['Inter', 'sans-serif'],
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px',
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-background-light dark:bg-background-dark font-display">
    <div
      class="relative flex min-h-screen w-full flex-col items-center justify-center bg-slate-50 group/design-root overflow-x-hidden"
      style="font-family: Inter, 'Noto Sans', sans-serif"
    >
      <div class="layout-container flex h-full grow flex-col">
        <div class="px-40 flex flex-1 justify-center py-5">
          <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
            <div class="flex flex-col items-center gap-4">
              <div class="flex items-center justify-center gap-2 mb-4">
                <span class="material-symbols-outlined text-primary text-4xl"
                  >health_and_safety</span
                >
                <h1 class="text-3xl font-bold text-[#0d171b]">MedAlert</h1>
              </div>
              <div class="flex flex-wrap justify-between gap-3 p-4 text-center">
                <div class="flex w-full flex-col gap-3">
                  <p class="text-[#0d171b] text-4xl font-black leading-tight tracking-[-0.033em]">
                    Sign In to MedAlert
                  </p>
                  <p class="text-[#4c809a] text-base font-normal leading-normal">
                    A unified portal for Patients, Admins, and Super Admins.
                  </p>
                </div>
              </div>
              <div class="w-full max-w-sm flex flex-col gap-4">
                <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3 w-full">
                  <label class="flex flex-col min-w-40 flex-1">
                    <p class="text-[#0d171b] text-base font-medium leading-normal pb-2">
                      Username or Email
                    </p>
                    <input
                      class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d171b] focus:outline-0 focus:ring-0 border border-[#cfdfe7] bg-slate-50 focus:border-primary h-14 placeholder:text-[#4c809a] p-[15px] text-base font-normal leading-normal"
                      placeholder="Enter your username or email"
                      value=""
                    />
                  </label>
                </div>
                <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3 w-full">
                  <label class="flex flex-col min-w-40 flex-1">
                    <p class="text-[#0d171b] text-base font-medium leading-normal pb-2">Password</p>
                    <div class="flex w-full flex-1 items-stretch">
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-[#0d171b] focus:outline-0 focus:ring-0 border border-[#cfdfe7] bg-slate-50 focus:border-primary h-14 placeholder:text-[#4c809a] p-[15px] border-r-0 pr-2 text-base font-normal leading-normal"
                        placeholder="Enter your password"
                        type="password"
                        value=""
                      />
                      <button
                        class="text-[#4c809a] flex border border-[#cfdfe7] bg-slate-50 items-center justify-center px-4 rounded-r-lg border-l-0 hover:bg-slate-100"
                      >
                        <span class="material-symbols-outlined">visibility</span>
                      </button>
                    </div>
                  </label>
                </div>
                <div class="flex px-4 py-3 w-full">
                  <button
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-slate-50 text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90"
                  >
                    <span class="truncate">Sign In</span>
                  </button>
                </div>
                <div class="flex items-center gap-2 px-4 py-3 w-full">
                  <hr class="flex-1 border-t border-[#cfdfe7]" />
                  <p class="text-sm font-medium text-[#4c809a]">OR</p>
                  <hr class="flex-1 border-t border-[#cfdfe7]" />
                </div>
                <div class="flex px-4 py-3 w-full">
                  <button
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-slate-200 text-[#0d171b] text-base font-bold leading-normal tracking-[0.015em] hover:bg-slate-300"
                  >
                    <span class="truncate">Continue as Guest</span>
                  </button>
                </div>
                <p class="text-[#4c809a] text-sm font-normal leading-normal px-4 text-center">
                  Don't have an account?
                  <a class="font-bold text-primary hover:underline" href="#">Sign Up</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
