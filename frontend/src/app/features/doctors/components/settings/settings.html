<div class="profile">
  <div class="header">
    <h2>Profile</h2>
    <p>Manage your personal information, address, and emergency contact.</p>
  </div>
  <div class="personal-info">
    <h3>Personal Information</h3>
    <div class="info-items">
      <div class="info-item">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" [(ngModel)]="new_user.fullName" placeholder="{{user?.fullName}}">
      </div>
      <div class="info-item">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" [(ngModel)]="new_user.email" placeholder="{{user?.email}}">
      </div>
      <div class="info-item">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" [(ngModel)]="new_user.phoneNumber" placeholder="{{user?.phoneNumber}}">
      </div>
      <div class="info-item">
        <label for="dob">Date of Birth:</label>
        <input type="text" id="dob" name="dob" [(ngModel)]="new_user.dateOfBirth" placeholder="{{user?.dateOfBirth}}">
      </div>
      <div class="info-item">
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" [(ngModel)]="new_user.address" placeholder="{{user?.address}}">
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="cancel-button" (click)="resetSettings()">Cancel</button>
    <button class="save-button" (click)="saveSettings()">Save Changes</button>
  </div>
</div>

<div class="security">
  <div class="header">
    <h2>Security</h2>
    <p>Update your password.</p>
  </div>
  <div class="password-update">
    <div class="info-item">
      <label for="currentPassword">Current Password:</label>
      <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password">
    </div>
    <div class="info-item">
      <label for="newPassword">New Password:</label>
      <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password">
    </div>
    <div class="info-item">
      <label for="confirmPassword">Confirm New Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password">
    </div>
  </div>
  <div class="buttons">
    <button class="cancel-button">Cancel</button>
    <button class="save-button" (click)="savePassword()">Update Password</button>
  </div>
</div>
<app-toast></app-toast>
