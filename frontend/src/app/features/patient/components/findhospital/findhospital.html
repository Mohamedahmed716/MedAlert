<main class="content">
  <div class="header">
    <h1>Find a Hospital</h1>
    <p>Search for hospitals near you</p>
  </div>

  <div class="search-bar">
    <input 
      type="text" 
      [(ngModel)]="searchText" 
      placeholder="Search by hospital name, city, or zip code...">
  </div>

  <div class="cards">
    <div class="card" *ngFor="let h of filteredHospitals">
      <div class="card-image" style="background-image: url('assets/hospital-placeholder.jpg');"></div>

      <div class="card-body">
        <h2>{{ h.name }}</h2>
        <p class="location">📍 {{ h.streetAddress }}, {{ h.city }}, {{ h.state }}</p>
        <p>Contact: {{ h.phoneNumber }}</p>
        <a [href]="'http://' + h.website" target="_blank" class="website-link">{{ h.website }}</a>
        
        <button class="btn-primary full" [routerLink]="['/patient/hospital', h.id]">
          View Details
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="filteredHospitals.length === 0" class="empty-state">
    <p>No hospitals found matching your search.</p>
  </div>
</main>
