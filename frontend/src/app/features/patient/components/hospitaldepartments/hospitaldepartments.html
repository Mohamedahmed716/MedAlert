<div class="page-container">
  <h1 class="page-title">Departments</h1>
  <p class="page-subtitle">Select a department to find specialists.</p>

  <div class="department-list">
    <div class="department-card" 
         *ngFor="let d of departments" 
         [routerLink]="['/patient/hospital', hospitalId, 'departments', d.name]">
      <div class="department-info">
        <div class="department-icon">⚕️</div>
        <div class="department-text">
          <h3>{{ d.name }}</h3>
          <p>{{ d.description }}</p>
        </div>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>

  <div *ngIf="departments.length === 0" class="empty-state">
    <p>No departments found for this hospital.</p>
  </div>
</div>
