<div class="page-container">
  <h1 class="page-title">My Reservations</h1>

  <div class="tab-container">
    <button class="tab-btn" [class.active]="activeTab === 'upcoming'" (click)="switchTab('upcoming')">
      Upcoming
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'past'" (click)="switchTab('past')">
      Past / Cancelled
    </button>
  </div>

  <div class="search-bar">
    <input type="text" class="search-input" placeholder="Search by doctor..." [(ngModel)]="searchText" />
  </div>

  <div *ngIf="activeTab === 'upcoming'">
    <div *ngFor="let r of filteredUpcoming" class="reservation-card">
      <div class="reservation-main">
        <div class="reservation-status">{{ r.status }}</div>
        <div class="reservation-text">
          <div class="doctor-name">{{ r.patientName }}</div>
          <div class="reason">Reason: {{ r.reason }}</div>
          <div class="time-label">Date: {{ r.appointmentTime | date:'medium' }}</div>
        </div>
      </div>
      <div class="reservation-actions">
        <button class="btn-reschedule" (click)="reschedule(r)">Reschedule</button>
        <button class="btn-cancel" (click)="cancel(r)">Cancel</button>
      </div>
    </div>
  </div>

  </div>
