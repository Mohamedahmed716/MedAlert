<div class="dashboard-container">
  <h1>My Reservations</h1>

  <div class="search-box">
    <input type="text" [(ngModel)]="searchQuery" placeholder="Search by doctor's name..." />
    <span class="material-symbols-outlined">search</span>
  </div>

  <div class="reservation-list">
    <div *ngFor="let r of upcomingReservations" class="reservation-card">
      <div class="reservation-info">
        <p class="status">{{ r.status }}</p>
        <p class="doctor">{{ r.doctor }}, {{ r.specialty }}</p>
        <p class="clinic">{{ r.clinic }}</p>
        <p class="date">{{ r.date }}</p>
      </div>
      <div class="reservation-actions">
        <button class="reschedule">
          <span class="material-symbols-outlined">edit_calendar</span>
          Reschedule
        </button>
        <button class="cancel">
          <span class="material-symbols-outlined">cancel</span>
          Cancel
        </button>
      </div>
    </div>

    <div *ngIf="upcomingReservations.length === 0" class="empty-state">
      <span class="material-symbols-outlined">event_note</span>
      <p>No upcoming reservations</p>
      <p>You're all caught up! Book a new appointment to see it here.</p>
      <button>Book a New Appointment</button>
    </div>
  </div>
</div>
