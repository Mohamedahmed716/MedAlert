<div class="dashboard-container" *ngIf="hospital">
  <header class="header">
    <h1>{{ hospital.name }}</h1>
  </header>

  <section class="info-box">
    <h2>Hospital Information</h2>
    <div class="info-item">
      <span class="icon">📍</span>
      <p>{{ hospital.streetAddress }}, {{ hospital.city }}, {{ hospital.state }} {{ hospital.zipCode }}</p>
    </div>
    <div class="info-item">
      <span class="icon">📞</span>
      <p>{{ hospital.phoneNumber }}</p>
    </div>
    <div class="info-item">
      <span class="icon">🌐</span>
      <p>{{ hospital.website }}</p>
    </div>
  </section>

  <section class="features">
    <div class="feature-card" 
     *ngIf="hospital?.Id" 
     [routerLink]="['/patient/hospital', hospital.hospitalId, 'departments']">
  <div class="feature-icon">🏥</div>
  <h3>View Departments</h3>
</div>

    <div class="feature-card" routerLink="/patient/er">
      <div class="feature-icon">⚠️</div>
      <h3>ER Status</h3>
      <p class="status">Normal Wait Time</p>
    </div>
  </section>
</div>
