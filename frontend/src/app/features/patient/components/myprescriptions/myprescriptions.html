<div class="page-container">
  <h1 class="page-title">My Prescriptions</h1>
  
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="Search medication..." [(ngModel)]="searchText"/>
  </div>

  <div class="prescription-list">
    <div class="prescription-card" *ngFor="let p of filteredPrescriptions">
      <div class="prescription-left">
        <div class="prescription-icon">💊</div>
        <div class="prescription-details">
          <h3>{{ p.medicationName }}</h3>
          <p><strong>Dosage:</strong> {{ p.dosage }}</p>
          <p><strong>Frequency:</strong> {{ p.frequency }}</p>
          <p><strong>Duration:</strong> {{ p.duration }} {{ p.durationTime }}</p>
          <p><em>Instructions:</em> {{ p.instructions }}</p>
          <p class="date-label">Prescribed on: {{ p.prescribedDate | date }}</p>
        </div>
      </div>

      <div class="prescription-actions">
        <button class="btn-details" (click)="viewPrescription(p)">View Details</button>
        <button class="btn-print" (click)="printPrescription(p)">Print</button>
      </div>
    </div>
  </div>

  <div *ngIf="filteredPrescriptions.length === 0" class="empty-state">
    <p>No prescriptions found.</p>
  </div>
</div>
