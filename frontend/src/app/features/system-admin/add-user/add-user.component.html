<div class="layout-wrapper">
  <div class="layout-container">
    <header class="header">
      <div class="logo-container">
        <img class="logo-icon" src="assets/Logo.png" alt="MedAlert Logo" />
      </div>
      <div class="header-actions">
        <button class="icon-btn">
          <span class="material-symbols-outlined">person</span>
        </button>
        <button class="icon-btn" (click)="logout()">
          <span class="material-symbols-outlined">logout</span>
        </button>
        <div class="profile-avatar" [style.background-image]="'url(' + profilePhotoUrl + ')'"></div>
      </div>
    </header>
    <main class="main-content">
      <div class="form-container">
        <div class="page-header">
          <div class="page-title-group">
            <p class="page-title">{{ isEditMode ? 'Edit User' : 'Create a New User' }}</p>
            <p class="page-subtitle">
              {{
                isEditMode
                  ? 'Update existing user details.'
                  : 'Enter details to register a new user in the system.'
              }}
            </p>
          </div>
        </div>

        <form class="form-layout" (ngSubmit)="onSaveUser()" #userForm="ngForm">
          <div *ngIf="errorMessage" class="error-banner">
            <span class="material-symbols-outlined">error</span>
            {{ errorMessage }}
          </div>

          <div class="card">
            <h2 class="card-title">User Credentials</h2>
            <div class="card-grid">
              <div class="grid-span-2">
                <label class="form-label">
                  <p class="input-label">Full Name</p>
                  <input
                    class="form-input"
                    [class.invalid]="nameField.invalid && nameField.touched"
                    placeholder="Enter user's full name"
                    type="text"
                    name="fullName"
                    [(ngModel)]="user.fullName"
                    required
                    #nameField="ngModel"
                  />
                  <div *ngIf="nameField.invalid && nameField.touched" class="error-text">
                    Full Name is required.
                  </div>
                </label>
              </div>

              <div class="grid-span-2">
                <label class="form-label">
                  <p class="input-label">Email</p>
                  <input
                    class="form-input"
                    [class.invalid]="emailField.invalid && emailField.touched"
                    placeholder="Enter user's email address"
                    type="email"
                    name="email"
                    [(ngModel)]="user.email"
                    required
                    #emailField="ngModel"
                  />
                  <div *ngIf="emailField.invalid && emailField.touched" class="error-text">
                    Email is required.
                  </div>
                </label>
              </div>

              <div class="grid-span-2">
                <label class="form-label">
                  <p class="input-label">Gender</p>
                  <div class="custom-select-container" (click)="$event.stopPropagation()">
                    <div
                      class="form-input select-trigger"
                      [class.active]="isGenderOpen"
                      (click)="toggleGender()"
                    >
                      <span>{{ user.gender }}</span>
                      <span
                        class="material-symbols-outlined select-arrow"
                        [class.rotate]="isGenderOpen"
                        >expand_more</span
                      >
                    </div>

                    <div class="custom-options" *ngIf="isGenderOpen">
                      <div class="option-item" *ngFor="let g of genders" (click)="selectGender(g)">
                        {{ g }}
                      </div>
                    </div>
                  </div>
                </label>
              </div>

              <div>
                <label class="form-label">
                  <p class="input-label">
                    {{ isEditMode ? 'New Password' : 'Create Password' }}
                    <span *ngIf="isEditMode" class="label-optional">(Optional)</span>
                  </p>
                  <div class="password-wrapper">
                    <input
                      class="form-input password-input"
                      [class.invalid]="passField.invalid && passField.touched"
                      placeholder="Enter a secure password"
                      [type]="passwordVisible1 ? 'text' : 'password'"
                      name="password"
                      [(ngModel)]="user.password"
                      #passField="ngModel"
                      [required]="!isEditMode"
                    />
                    <button class="toggle-visibility" type="button" (click)="togglePassword1()">
                      <span class="material-symbols-outlined">{{
                        passwordVisible1 ? 'visibility' : 'visibility_off'
                      }}</span>
                    </button>
                  </div>
                  <div *ngIf="passField.invalid && passField.touched" class="error-text">
                    Password is required.
                  </div>
                </label>
              </div>

              <div>
                <label class="form-label">
                  <p class="input-label">Confirm Password</p>
                  <div class="password-wrapper">
                    <input
                      class="form-input password-input"
                      [class.invalid]="confirmPassField.invalid && confirmPassField.touched"
                      placeholder="Confirm the password"
                      [type]="passwordVisible2 ? 'text' : 'password'"
                      name="confirmPassword"
                      [(ngModel)]="user.confirmPassword"
                      #confirmPassField="ngModel"
                      [required]="!isEditMode || user.password !== ''"
                    />
                    <button class="toggle-visibility" type="button" (click)="togglePassword2()">
                      <span class="material-symbols-outlined">{{
                        passwordVisible2 ? 'visibility' : 'visibility_off'
                      }}</span>
                    </button>
                  </div>
                  <div
                    *ngIf="confirmPassField.invalid && confirmPassField.touched"
                    class="error-text"
                  >
                    Please confirm the password.
                  </div>
                  <div
                    class="error-text"
                    *ngIf="user.password && user.password !== user.confirmPassword"
                  >
                    Passwords do not match.
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="card">
            <h2 class="card-title">Role & Permissions</h2>
            <div class="card-grid">
              <div class="grid-span-2">
                <label class="form-label">
                  <p class="input-label">User Role</p>
                  <div class="custom-select-container" (click)="$event.stopPropagation()">
                    <div
                      class="form-input select-trigger"
                      [class.active]="isRoleOpen"
                      (click)="toggleRole()"
                    >
                      <span [class.placeholder-text]="!user.role">{{
                        user.role || 'Select a role'
                      }}</span>
                      <span
                        class="material-symbols-outlined select-arrow"
                        [class.rotate]="isRoleOpen"
                        >expand_more</span
                      >
                    </div>

                    <div class="custom-options" *ngIf="isRoleOpen">
                      <div
                        class="option-item"
                        *ngFor="let role of roles"
                        (click)="selectRole(role)"
                      >
                        <span class="material-symbols-outlined option-icon">
                          {{
                            role === 'Doctor'
                              ? 'stethoscope'
                              : role === 'Patient'
                              ? 'person'
                              : 'admin_panel_settings'
                          }}
                        </span>
                        {{ role }}
                      </div>
                    </div>
                  </div>
                </label>
              </div>

              <div class="grid-span-2" *ngIf="showHospitalField">
                <label class="form-label">
                  <p class="input-label">Hospital Assignment</p>
                  <div class="custom-select-container" (click)="$event.stopPropagation()">
                    <div
                      class="form-input select-trigger"
                      [class.active]="isHospitalOpen"
                      (click)="toggleHospital()"
                    >
                      <span [class.placeholder-text]="!user.hospital">{{
                        selectedHospitalName || 'Select a hospital'
                      }}</span>
                      <span
                        class="material-symbols-outlined select-arrow"
                        [class.rotate]="isHospitalOpen"
                        >domain</span
                      >
                    </div>

                    <div class="custom-options" *ngIf="isHospitalOpen">
                      <div class="option-item disabled" *ngIf="hospitals.length === 0">
                        No hospitals found...
                      </div>
                      <div
                        class="option-item"
                        *ngFor="let h of hospitals"
                        (click)="selectHospital(h.id)"
                      >
                        <span class="material-symbols-outlined option-icon">local_hospital</span>
                        {{ h.name }}
                      </div>
                    </div>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-secondary" type="button" (click)="onCancel()">Cancel</button>

            <button
              class="btn btn-primary"
              type="submit"
              [disabled]="
                userForm.invalid || (user.password && user.password !== user.confirmPassword)
              "
            >
              {{ isEditMode ? 'Update User' : 'Create User' }}
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
