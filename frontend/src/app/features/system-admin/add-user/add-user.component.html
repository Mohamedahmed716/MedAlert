<div class="layout-wrapper">
  <div class="layout-container">
    <header class="header">
      <div class="logo-container">
        <img class="logo-icon" src="assets/Logo.png" alt="MedAlert Logo" />
      </div>
      <div class="header-actions">
        <button class="icon-btn">
          <span class="material-symbols-outlined">person</span>
        </button>
        <button class="icon-btn" (click)="logout()">
          <span class="material-symbols-outlined">logout</span>
        </button>
        <div
          class="profile-avatar"
          style="
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC1JdiNkZXxoMHgmOOxvQwDhU6cjXEGfUCLxYx9mAtPl0UaKXrh0yTCdp-6RQc9PmUjkEggSDpw30r_DV7yqWx3SoTuBpvdXvFsK3me1ezq8x4PpSBOQqyvrPQNtKhYP2rxAF34A6ousnlw08zmx__zTcsJm37moVIpirCvzdIsMtk_2wkfGH3TnBl8YSl2bWawO2CI8FKUTA3TPhhgVE_0CZtVPiMAR3q9sG_VFRp_pS1HOz64sX5z-XDoAXsrG82pOBgqkQXsXdc');
          "
        ></div>
      </div>
    </header>
    <main class="main-content">
      <div class="form-container">
        <div class="page-header">
          <div class="page-title-group">
            <p class="page-title">{{ isEditMode ? 'Edit User' : 'Create a New User' }}</p>
            <p class="page-subtitle">
              {{
                isEditMode
                  ? 'Update existing user details.'
                  : 'Enter details to register a new user in the system.'
              }}
            </p>
          </div>
        </div>

        <form class="form-layout" (ngSubmit)="onSaveUser()" #userForm="ngForm">
          <div *ngIf="errorMessage" class="error-banner">
            <span class="material-symbols-outlined">error</span>
            {{ errorMessage }}
          </div>

          <div class="card">
            <h2 class="card-title">User Credentials</h2>
            <div class="card-grid">
              <div class="grid-span-2">
                <label class="form-label">
                  <p class="input-label">Full Name</p>
                  <input
                    class="form-input"
                    [class.invalid]="nameField.invalid && nameField.touched"
                    placeholder="Enter user's full name"
                    type="text"
                    name="fullName"
                    [(ngModel)]="user.fullName"
                    required
                    #nameField="ngModel"
                  />
                  <div *ngIf="nameField.invalid && nameField.touched" class="error-text">
                    Full Name is required.
                  </div>
                </label>
              </div>

              <div class="grid-span-2">
                <label class="form-label">
                  <p class="input-label">Email</p>
                  <input
                    class="form-input"
                    [class.invalid]="emailField.invalid && emailField.touched"
                    placeholder="Enter user's email address"
                    type="email"
                    name="email"
                    [(ngModel)]="user.email"
                    required
                    #emailField="ngModel"
                  />
                  <div *ngIf="emailField.invalid && emailField.touched" class="error-text">
                    Email is required.
                  </div>
                </label>
              </div>

              <div>
                <label class="form-label">
                  <p class="input-label">
                    {{ isEditMode ? 'New Password' : 'Create Password' }}
                    <span *ngIf="isEditMode" class="label-optional">(Optional)</span>
                  </p>
                  <div class="password-wrapper">
                    <input
                      class="form-input password-input"
                      [class.invalid]="passField.invalid && passField.touched"
                      placeholder="Enter a secure password"
                      [type]="passwordVisible1 ? 'text' : 'password'"
                      name="password"
                      [(ngModel)]="user.password"
                      #passField="ngModel"
                      [required]="!isEditMode"
                    />
                    <button class="toggle-visibility" type="button" (click)="togglePassword1()">
                      <span class="material-symbols-outlined">{{
                        passwordVisible1 ? 'visibility' : 'visibility_off'
                      }}</span>
                    </button>
                  </div>
                  <div *ngIf="passField.invalid && passField.touched" class="error-text">
                    Password is required.
                  </div>
                </label>
              </div>

              <div>
                <label class="form-label">
                  <p class="input-label">Confirm Password</p>
                  <div class="password-wrapper">
                    <input
                      class="form-input password-input"
                      [class.invalid]="confirmPassField.invalid && confirmPassField.touched"
                      placeholder="Confirm the password"
                      [type]="passwordVisible2 ? 'text' : 'password'"
                      name="confirmPassword"
                      [(ngModel)]="user.confirmPassword"
                      #confirmPassField="ngModel"
                      [required]="!isEditMode || user.password !== ''"
                    />
                    <button class="toggle-visibility" type="button" (click)="togglePassword2()">
                      <span class="material-symbols-outlined">{{
                        passwordVisible2 ? 'visibility' : 'visibility_off'
                      }}</span>
                    </button>
                  </div>
                  <div
                    *ngIf="confirmPassField.invalid && confirmPassField.touched"
                    class="error-text"
                  >
                    Please confirm the password.
                  </div>
                  <div
                    class="error-text"
                    *ngIf="user.password && user.password !== user.confirmPassword"
                  >
                    Passwords do not match.
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="card">
            <h2 class="card-title">Role & Permissions</h2>
            <div class="card-grid">
              <div class="grid-span-2">
                <label class="form-label">
                  <p class="input-label">User Role</p>
                  <div class="select-wrapper">
                    <select
                      class="form-input"
                      [class.invalid]="roleField.invalid && roleField.touched"
                      name="role"
                      [(ngModel)]="user.role"
                      required
                      #roleField="ngModel"
                    >
                      <option value="" disabled selected>Select a role</option>
                      <option value="Patient">Patient</option>
                      <option value="Doctor">Doctor</option>
                      <option value="Hospital Admin">Hospital Admin</option>
                      <option value="Super Admin">Super Admin</option>
                    </select>
                  </div>
                  <div *ngIf="roleField.invalid && roleField.touched" class="error-text">
                    Role selection is required.
                  </div>
                </label>
              </div>

              <div class="grid-span-2" *ngIf="showHospitalField">
                <label class="form-label">
                  <p class="input-label">Hospital Assignment</p>
                  <div class="select-wrapper">
                    <select
                      class="form-input"
                      [class.invalid]="hospitalField.invalid && hospitalField.touched"
                      name="hospital"
                      [(ngModel)]="user.hospital"
                      required
                      #hospitalField="ngModel"
                    >
                      <option value="" disabled selected>Select a hospital</option>
                      <option *ngFor="let h of hospitals" [value]="h.id">
                        {{ h.name }}
                      </option>
                    </select>
                  </div>
                  <div *ngIf="hospitalField.invalid && hospitalField.touched" class="error-text">
                    Hospital assignment is required.
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-secondary" type="button" (click)="onCancel()">Cancel</button>

            <button
              class="btn btn-primary"
              type="submit"
              [disabled]="
                userForm.invalid || (user.password && user.password !== user.confirmPassword)
              "
            >
              {{ isEditMode ? 'Update User' : 'Create User' }}
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
