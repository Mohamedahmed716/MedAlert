<!DOCTYPE html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Manage Hospital - MedAlert</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#3B82F6',
              'background-light': '#F9FAFB',
              'background-dark': '#101c22',
              secondary: '#6B7280',
              success: '#10B981',
              error: '#EF4444',
            },
            fontFamily: {
              display: ['Inter', 'sans-serif'],
            },
            borderRadius: { DEFAULT: '0.5rem', lg: '0.75rem', xl: '1rem', full: '9999px' },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-background-light dark:bg-background-dark font-display">
    <div
      class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden"
    >
      <div class="layout-container flex h-full grow flex-col">
        <header
          class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 px-10 py-3 bg-white dark:bg-background-dark sticky top-0 z-10"
        >
          <div class="flex items-center gap-4 text-slate-900 dark:text-white">
            <svg
              class="text-primary"
              fill="currentColor"
              height="24"
              viewbox="0 0 24 24"
              width="24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M4.28915 4.28915C2.76896 5.80934 1.72554 7.75723 1.30473 9.87258C0.883925 11.9879 1.09993 14.1805 1.92529 16.1731C2.75065 18.1657 4.14833 19.8688 5.94168 21.0822C7.73503 22.2956 9.84838 22.9696 12 22.9696C14.1516 22.9696 16.265 22.2956 18.0583 21.0822C19.8517 19.8688 21.2493 18.1657 22.0747 16.1731C22.9001 14.1805 23.1161 11.9879 22.6953 9.87258C22.2745 7.75723 21.231 5.80934 19.7108 4.28915L12 12L4.28915 4.28915Z"
                fill="currentColor"
              ></path>
            </svg>
            <h2
              class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]"
            >
              MedAlert
            </h2>
          </div>
          <div class="flex items-center gap-4">
            <button
              class="flex items-center justify-center rounded-lg h-10 text-slate-600 dark:text-slate-300 gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 hover:bg-slate-100 dark:hover:bg-slate-800"
            >
              <span class="material-symbols-outlined">person</span>
            </button>
            <button
              class="flex items-center justify-center rounded-lg h-10 text-slate-600 dark:text-slate-300 gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 hover:bg-slate-100 dark:hover:bg-slate-800"
            >
              <span class="material-symbols-outlined">logout</span>
            </button>
            <div
              class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
              data-alt="Super Admin's profile picture"
              style="
                background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQMJlmgnFXFp0qn8G02lJo-D2mcRH8gVLwAfz8XU0gKdXaStO8HmtNw-sAFZYArzSAo0twgdJ6TIc2t3mEm-k6kgLYOjTpJygqwlUi7gc43PTlrEx6cWbuE-ppH5pXCBonvrtl1oAPhaMJEApNzb2pwtG8Xk16y6MHVfo-7F2xP8GgygrYbpvtrtKtPCCL8m03JqQFflbHI5Fb4FZ9fAJ8rkK3LzfwHW8R3LmMigR9wZm1v1cYvUshg6cIuQv9Ygf4QpribvtRljQ');
              "
            ></div>
          </div>
        </header>
        <main class="flex-1 px-4 sm:px-6 lg:px-10 py-8">
          <div class="max-w-4xl mx-auto">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
              <div class="flex min-w-72 flex-col gap-1">
                <p
                  class="text-slate-900 dark:text-white text-3xl sm:text-4xl font-black leading-tight tracking-tighter"
                >
                  Manage Hospital
                </p>
                <p class="text-secondary dark:text-slate-400 text-base font-normal leading-normal">
                  Add a new hospital or edit an existing one
                </p>
              </div>
            </div>
            <form class="space-y-12">
              <div
                class="bg-white dark:bg-slate-900/50 p-6 sm:p-8 rounded-xl border border-slate-200 dark:border-slate-800"
              >
                <h2
                  class="text-slate-900 dark:text-white text-xl font-bold leading-tight tracking-tight pb-6 border-b border-slate-200 dark:border-slate-800"
                >
                  Hospital Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6 mt-6">
                  <div class="md:col-span-2">
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        Hospital Name
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="Enter hospital name"
                        required=""
                        value=""
                      />
                    </label>
                  </div>
                  <div>
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        Street Address
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="Enter street address"
                        required=""
                        value=""
                      />
                    </label>
                  </div>
                  <div>
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        City
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="Enter city"
                        required=""
                        value=""
                      />
                    </label>
                  </div>
                  <div>
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        State
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="Enter state"
                        required=""
                        value=""
                      />
                    </label>
                  </div>
                  <div>
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        Zip Code
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="Enter zip code"
                        required=""
                        value=""
                      />
                      <p class="text-error text-xs mt-1 hidden">Please enter a valid zip code.</p>
                    </label>
                  </div>
                  <div>
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        Hospital Phone Number
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="(123) 456-7890"
                        required=""
                        type="tel"
                        value=""
                      />
                    </label>
                  </div>
                  <div>
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        Hospital Website
                        <span class="text-slate-400 dark:text-slate-500">(Optional)</span>
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="https://example.com"
                        type="url"
                        value=""
                      />
                    </label>
                  </div>
                </div>
              </div>
              <div
                class="bg-white dark:bg-slate-900/50 p-6 sm:p-8 rounded-xl border border-slate-200 dark:border-slate-800"
              >
                <h2
                  class="text-slate-900 dark:text-white text-xl font-bold leading-tight tracking-tight pb-2"
                >
                  Hospital Admin Account
                </h2>
                <p
                  class="text-secondary dark:text-slate-400 text-sm font-normal leading-normal pb-6 border-b border-slate-200 dark:border-slate-800"
                >
                  Create an administrator account for this hospital.
                </p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6 mt-6">
                  <div>
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        Username
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 text-base font-normal leading-normal"
                        placeholder="Enter a username"
                        required=""
                        value=""
                      />
                    </label>
                  </div>
                  <div class="relative">
                    <label class="flex flex-col">
                      <p
                        class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal pb-2"
                      >
                        Password
                      </p>
                      <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 border border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark h-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-3 pr-10 text-base font-normal leading-normal"
                        placeholder="Enter a strong password"
                        required=""
                        type="password"
                        value=""
                      />
                      <button
                        class="absolute right-3 top-10 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary-light"
                        type="button"
                      >
                        <span class="material-symbols-outlined text-xl">visibility</span>
                      </button>
                    </label>
                  </div>
                </div>
              </div>
              <div class="flex justify-end gap-4 pt-4">
                <button
                  class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-32 px-6 hover:bg-slate-300 dark:hover:bg-slate-700"
                  type="button"
                >
                  Cancel
                </button>
                <button
                  class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-primary text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-32 px-6 hover:bg-primary/90"
                  type="submit"
                >
                  <span class="material-symbols-outlined hidden">sync</span>
                  Save Hospital
                </button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
