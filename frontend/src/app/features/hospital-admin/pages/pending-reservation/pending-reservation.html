<div class="page-container">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <h1 class="page-title">Pending Reservation Details</h1>

    <div class="content-grid">
      <!-- Patient & Reservation Info -->
      <section class="info-card">
        <h2>Patient Information</h2>

        <div class="info-grid">
          <div class="field">
            <label>Patient Name</label>
            <strong>Liam Johnson</strong>
          </div>
          <div class="field">
            <label>Contact Number</label>
            <strong>(555) 123-4567</strong>
          </div>
          <div class="field">
            <label>Email Address</label>
            <strong>liam.johnson&#64;example.com</strong>
          </div>
          <div class="field">
            <label>Date of Birth</label>
            <strong>October 26, 1988</strong>
          </div>
        </div>

        <div class="section">
          <label class="section-label">Reason for Visit</label>
          <p class="value">Annual check-up and persistent cough.</p>
        </div>

        <h2>Reservation Request</h2>

        <div class="info-grid">
          <div class="field">
            <label>Requested</label>
            <strong>Doctor</strong>
          </div>
          <div class="field">
            <label>Doctor's Name</label>
            <strong>Dr. Ava Chen</strong>
          </div>
          <div class="field">
            <label>Department</label>
            <strong>Cardiology</strong>
          </div>
          <div class="field">
            <label>Requested Date & Time</label>
            <strong>November 15, 2023, 10:30 AM</strong>
          </div>
        </div>
      </section>

      <!-- Actions Panel -->
      <section class="actions-card">
        <h2>Actions</h2>

        <button class="btn-accept" (click)="onAccept()">
          Accept Reservation
        </button>

        <button class="btn-decline" (click)="onDecline()">
          Decline Reservation
        </button>

        <form [formGroup]="reservationForm">
          <label class="decline-label">Reason for Decline (Optional)</label>
          <textarea
            formControlName="declineReason"
            placeholder="e.g., Doctor unavailable"
            class="decline-textarea"
          ></textarea>
        </form>

        <hr class="divider">

        <button class="contact-link" (click)="contactPatient()">
          <img src="https://codia-f2c.s3.us-west-1.amazonaws.com/image/2025-11-30/uAmZhCguzA.png" alt="contact">
          Contact Patient
        </button>
      </section>
    </div>
  </main>
</div>
