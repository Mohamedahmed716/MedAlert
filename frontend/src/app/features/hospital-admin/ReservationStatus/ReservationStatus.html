<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Reservation Confirmation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link href="ReservationStatus.css" rel="stylesheet"/>
</head>
<body>
<div class="layout-wrapper">
  <div class="layout-container">
    <div class="content-center">
      <div class="content-card">
        <div class="card-content">
          <div class="success-icon-wrapper">
            <span class="material-symbols-outlined success-icon">check_circle</span>
          </div>

          <div class="text-section">
            <h1>Reservation Accepted</h1>
            <p>The reservation for John Smith has been successfully accepted.</p>
          </div>

          <div class="details-section">
            <div class="detail-row">
              <p class="detail-label">Patient Name</p>
              <p class="detail-value">John Smith</p>
            </div>
            <div class="detail-row">
              <p class="detail-label">Appointment Date</p>
              <p class="detail-value">October 26, 2023</p>
            </div>
            <div class="detail-row">
              <p class="detail-label">Time</p>
              <p class="detail-value">2:30 PM</p>
            </div>
            <div class="detail-row">
              <p class="detail-label">Department</p>
              <p class="detail-value">Cardiology</p>
            </div>
          </div>

          <div class="actions-section">
            <button class="primary-btn">Return to Pending Reservations</button>
            <button class="secondary-btn">View All Reservations</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
