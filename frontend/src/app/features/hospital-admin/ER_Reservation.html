<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MedAlert - Urgent ER Notification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1193d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                        "card-light": "#ffffff",
                        "card-dark": "#1a2a33",
                        "text-light-primary": "#0d171b",
                        "text-dark-primary": "#f0f4f6",
                        "text-light-secondary": "#4c809a",
                        "text-dark-secondary": "#9cb0bd",
                        "border-light": "#e7eff3",
                        "border-dark": "#2a3f4c",
                        "danger": "#d9534f",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px",
                    },
                },
            },
        };
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
            font-size: 20px;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full">
<aside class="w-64 flex-col bg-card-light dark:bg-card-dark border-r border-border-light dark:border-border-dark hidden lg:flex">
<div class="flex items-center gap-3 px-6 h-[65px] border-b border-border-light dark:border-border-dark">
<div class="text-primary size-7">
<svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
</svg>
</div>
<h2 class="text-text-light-primary dark:text-text-dark-primary text-lg font-bold leading-tight tracking-[-0.015em]">MedAlert</h2>
</div>
<nav class="p-4 flex-1">
<ul class="space-y-2">
<li>
<a class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-sm font-medium">Dashboard</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary" href="#">
<span class="material-symbols-outlined">groups</span>
<span class="text-sm font-medium">Patients</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-text-light-primary dark:text-text-dark-primary bg-primary/10 text-primary font-semibold" href="#">
<span class="material-symbols-outlined">emergency</span>
<span class="text-sm">ER Alerts</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary" href="#">
<span class="material-symbols-outlined">medical_services</span>
<span class="text-sm font-medium">Doctors</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 rounded-lg px-4 py-2.5 text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-sm font-medium">Settings</span>
</a>
</li>
</ul>
</nav>
</aside>
<div class="flex flex-1 flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-border-light dark:border-border-dark px-6 sm:px-10 py-3 bg-card-light dark:bg-card-dark sticky top-0 z-10">
<div class="flex items-center gap-4 text-text-light-primary dark:text-text-dark-primary lg:hidden">
<div class="text-primary size-7">
<svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
</svg>
</div>
<h2 class="text-text-light-primary dark:text-text-dark-primary text-lg font-bold leading-tight tracking-[-0.015em]">MedAlert</h2>
</div>
<div class="flex flex-1 justify-end items-center gap-4">
<div class="flex gap-2">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 w-10 bg-background-light dark:bg-background-dark text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
<div class="flex items-center gap-3">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="Profile picture for Admin" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBiKUrOJP7SnyjpWQl4IX0Rc17nhYC9ZweoQwiWawhhqf04vTAoa4_p6ZRlqUoq8RwAoXpVAtuToMfGuOjrRpmjyJeP5zoAbArIUo0Se1x6ufVFQYViBTMiMxYz2W9Gv_K7zX4ZKlDnE9L09Hh7vu3oIiEZSrlcA3vKiOyj9oYenYHGxwrzOfZdh9xNQJ0IhX8b8wr4WxrLFgoe70iLe8lwC9q_LQ75yb8Zcc58WXpyBx0d1D9yRTmXSfPWuwkjC7IqnULIX5BrTEk");'></div>
<div class="hidden sm:flex flex-col text-right">
<span class="text-sm font-semibold text-text-light-primary dark:text-text-dark-primary">Admin User</span>
<span class="text-xs text-text-light-secondary dark:text-text-dark-secondary">Hospital Administrator</span>
</div>
</div>
</div>
</header>
<main class="px-4 sm:px-10 flex flex-1 justify-center py-5">
<div class="flex flex-col w-full max-w-2xl flex-1">
<div class="flex flex-col gap-2 mb-8">
<p class="text-text-light-primary dark:text-text-dark-primary text-3xl md:text-4xl font-black leading-tight tracking-[-0.033em]">Urgent ER Notification</p>
<p class="text-text-light-secondary dark:text-text-dark-secondary text-base font-normal leading-normal">Send an immediate alert to a doctor for an incoming ER patient.</p>
</div>
<div class="bg-card-light dark:bg-card-dark p-6 sm:p-8 rounded-xl border border-border-light dark:border-border-dark shadow-sm">
<form class="space-y-6">
<div>
<label class="block text-sm font-medium text-text-light-primary dark:text-text-dark-primary mb-2" for="doctor">Select Doctor</label>
<div class="relative">
<select class="form-select w-full appearance-none rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-3 text-text-light-primary dark:text-text-dark-primary focus:outline-none focus:ring-2 focus:ring-primary/50" id="doctor">
<option>Select a doctor...</option>
<option>Dr. Evelyn Reed - Cardiologist</option>
<option>Dr. Ben Carter - Neurologist</option>
<option>Dr. Olivia Chen - Pediatrician</option>
</select>
<span class="material-symbols-outlined pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-text-light-secondary dark:text-text-dark-secondary">expand_more</span>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<div>
<label class="block text-sm font-medium text-text-light-primary dark:text-text-dark-primary mb-2" for="patient-details">Patient Details (Optional)</label>
<input class="form-input w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-3 text-text-light-primary dark:text-text-dark-primary placeholder:text-text-light-secondary placeholder:dark:text-text-dark-secondary focus:outline-none focus:ring-2 focus:ring-primary/50" id="patient-details" placeholder="e.g., John Doe, 45M" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-text-light-primary dark:text-text-dark-primary mb-2" for="er-bed">ER Bed Number</label>
<input class="form-input w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-3 text-text-light-primary dark:text-text-dark-primary placeholder:text-text-light-secondary placeholder:dark:text-text-dark-secondary focus:outline-none focus:ring-2 focus:ring-primary/50" id="er-bed" placeholder="e.g., Bed 14" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-text-light-primary dark:text-text-dark-primary mb-2" for="reason">Reason for Urgent Request</label>
<textarea class="form-textarea w-full rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark px-4 py-3 text-text-light-primary dark:text-text-dark-primary placeholder:text-text-light-secondary placeholder:dark:text-text-dark-secondary focus:outline-none focus:ring-2 focus:ring-primary/50" id="reason" placeholder="Briefly describe the patient's condition and why the alert is urgent..." rows="4"></textarea>
</div>
<div class="pt-4">
<button class="w-full flex items-center justify-center gap-2 rounded-lg bg-danger text-white h-12 px-6 text-base font-bold transition-colors hover:bg-danger/90 focus:outline-none focus:ring-2 focus:ring-danger/50 focus:ring-offset-2 dark:focus:ring-offset-card-dark" type="submit">
<span class="material-symbols-outlined">campaign</span>
<span>Send Alert</span>
</button>
</div>
</form>
</div>
</div>
</main>
</div>
</div>

</body></html>
