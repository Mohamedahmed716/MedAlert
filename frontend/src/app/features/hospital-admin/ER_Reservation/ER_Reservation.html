<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MedAlert - Urgent ER Notification</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link href="ER_Reservation.css" rel="stylesheet"/>
</head>
<body>
<div class="layout-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-section">
      <svg class="logo-icon" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
      </svg>
      <h2>MedAlert</h2>
    </div>

    <nav class="nav-menu">
      <a href="#" class="nav-item">
        <span class="material-symbols-outlined">dashboard</span>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item">
        <span class="material-symbols-outlined">groups</span>
        <span>Patients</span>
      </a>
      <a href="#" class="nav-item active">
        <span class="material-symbols-outlined">emergency</span>
        <span>ER Alerts</span>
      </a>
      <a href="#" class="nav-item">
        <span class="material-symbols-outlined">medical_services</span>
        <span>Doctors</span>
      </a>
      <a href="#" class="nav-item">
        <span class="material-symbols-outlined">settings</span>
        <span>Settings</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper">
    <header class="header">
      <div class="header-mobile-logo">
        <svg class="logo-icon" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"></path>
        </svg>
        <h2>MedAlert</h2>
      </div>
      <div class="header-right">
        <button class="notification-btn">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <div class="user-section">
          <div class="user-avatar" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBiKUrOJP7SnyjpWQl4IX0Rc17nhYC9ZweoQwiWawhhqf04vTAoa4_p6ZRlqUoq8RwAoXpVAtuToMfGuOjrRpmjyJeP5zoAbArIUo0Se1x6ufVFQYViBTMiMxYz2W9Gv_K7zX4ZKlDnE9L09Hh7vu3oIiEZSrlcA3vKiOyj9oYenYHGxwrzOfZdh9xNQJ0IhX8b8wr4WxrLFgoe70iLe8lwC9q_LQ75yb8Zcc58WXpyBx0d1D9yRTmXSfPWuwkjC7IqnULIX5BrTEk");'></div>
          <div class="user-info">
            <span class="user-name">Admin User</span>
            <span class="user-role">Hospital Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="content-container">
        <div class="page-header">
          <h1>Urgent ER Notification</h1>
          <p>Send an immediate alert to a doctor for an incoming ER patient.</p>
        </div>

        <div class="form-card">
          <form class="er-form">
            <div class="form-group">
              <label for="doctor">Select Doctor</label>
              <div class="select-wrapper">
                <select id="doctor" class="form-select">
                  <option>Select a doctor...</option>
                  <option>Dr. Evelyn Reed - Cardiologist</option>
                  <option>Dr. Ben Carter - Neurologist</option>
                  <option>Dr. Olivia Chen - Pediatrician</option>
                </select>
                <span class="material-symbols-outlined select-icon">expand_more</span>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="patient-details">Patient Details (Optional)</label>
                <input type="text" id="patient-details" placeholder="e.g., John Doe, 45M" class="form-input"/>
              </div>
              <div class="form-group">
                <label for="er-bed">ER Bed Number</label>
                <input type="text" id="er-bed" placeholder="e.g., Bed 14" class="form-input"/>
              </div>
            </div>

            <div class="form-group">
              <label for="reason">Reason for Urgent Request</label>
              <textarea id="reason" rows="4" placeholder="Briefly describe the patient's condition and why the alert is urgent..." class="form-textarea"></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="alert-btn">
                <span class="material-symbols-outlined">campaign</span>
                <span>Send Alert</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
