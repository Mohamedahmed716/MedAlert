<div class="toast-container">
  <div 
    *ngFor="let toast of toasts; trackBy: trackByToastId" 
    class="toast"
    [ngClass]="'toast-' + toast.type"
    [@slideIn]>
    
    <div class="toast-content">
      <div class="toast-header">
        <div class="toast-icon">{{ getIcon(toast.type) }}</div>
        <div class="toast-title">{{ toast.title }}</div>
        <button 
          *ngIf="!toast.showConfirm"
          class="toast-close" 
          (click)="closeToast(toast.id)"
          aria-label="Close">
          ×
        </button>
      </div>
      
      <div class="toast-message">{{ toast.message }}</div>
      
      <div *ngIf="toast.showConfirm" class="toast-actions">
        <button 
          class="toast-btn toast-btn-confirm" 
          (click)="onConfirm(toast)">
          {{ toast.confirmText || 'Confirm' }}
        </button>
        <button 
          class="toast-btn toast-btn-cancel" 
          (click)="onCancel(toast)">
          {{ toast.cancelText || 'Cancel' }}
        </button>
      </div>
    </div>
    
    <div 
      *ngIf="!toast.showConfirm && toast.duration" 
      class="toast-progress"
      [style.animation-duration.ms]="toast.duration">
    </div>
  </div>
</div>
